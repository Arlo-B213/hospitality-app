<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Pride Training App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: linear-gradient(to bottom right, #f9fafb, #f3f4f6);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      max-width: 28rem;
      width: 100%;
    }

    .card {
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      text-align: center;
    }

    .icon-wrapper {
      margin-bottom: 1.5rem;
    }

    .icon-circle {
      width: 5rem;
      height: 5rem;
      margin: 0 auto;
      background: #fee2e2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon {
      width: 2.5rem;
      height: 2.5rem;
      color: #dc2626;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.5rem;
    }

    .description {
      color: #4b5563;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .info-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .info-box p {
      font-size: 0.875rem;
      color: #1e40af;
    }

    .info-box strong {
      font-weight: 600;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      background: #fee2e2;
      color: #7f1d1d;
    }

    .status-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      margin-right: 0.5rem;
      background: #dc2626;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1rem;
    }

    .button-primary {
      background: #4f46e5;
      color: white;
    }

    .button-primary:hover {
      background: #4338ca;
    }

    .button-secondary {
      background: #d1d5db;
      color: #1f2937;
    }

    .button-secondary:hover {
      background: #b3b8c7;
    }

    .footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: #6b7280;
    }

    .footer p {
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <!-- Icon -->
      <div class="icon-wrapper">
        <div class="icon-circle">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8.111 16H5m13.889 0h3M5 12h3m13.889 0h3M5 8h3m13.889 0h3M9 20a2 2 0 110-4 2 2 0 010 4zm6-16a2 2 0 110 4 2 2 0 010-4zm0 8a2 2 0 110 4 2 2 0 010-4z">
            </path>
          </svg>
        </div>
      </div>

      <!-- Status -->
      <h1>No Connection</h1>
      <p class="description" id="statusText">
        You are currently offline. Some features may be unavailable.
      </p>

      <!-- Info Box -->
      <div class="info-box">
        <p>
          <strong>Good news:</strong> Your recent data is cached locally. You can view
          previously loaded dashboards and evaluations.
        </p>
      </div>

      <!-- Connection Status Badge -->
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span id="badgeText">Offline</span>
      </div>

      <!-- Action Buttons -->
      <div class="button-group">
        <button class="button-primary" onclick="location.reload()">
          Try Again
        </button>
        <button class="button-secondary" onclick="history.back()">
          Go Back
        </button>
      </div>

      <!-- Help Text -->
      <div class="footer">
        <p>Check your internet connection and try again.</p>
        <p id="footerText">Waiting for connection...</p>
      </div>
    </div>
  </div>

  <script>
    // Update UI based on connection status
    function updateConnectionStatus() {
      const isOnline = navigator.onLine;
      const statusText = document.getElementById('statusText');
      const statusBadge = document.getElementById('statusBadge');
      const badgeText = document.getElementById('badgeText');
      const footerText = document.getElementById('footerText');

      if (isOnline) {
        statusText.textContent = 'You are back online! Reconnecting...';
        statusBadge.style.background = '#d1fae5';
        statusBadge.style.color = '#065f46';
        const dot = statusBadge.querySelector('.status-dot');
        if (dot) {
          dot.style.background = '#059669';
        }
        badgeText.textContent = 'Back Online';
        footerText.textContent = 'Connection restored. Reloading...';

        // Reload after a short delay
        setTimeout(() => {
          location.reload();
        }, 1000);
      } else {
        statusText.textContent = 'You are currently offline. Some features may be unavailable.';
        statusBadge.style.background = '#fee2e2';
        statusBadge.style.color = '#7f1d1d';
        const dot = statusBadge.querySelector('.status-dot');
        if (dot) {
          dot.style.background = '#dc2626';
        }
        badgeText.textContent = 'Offline';
        footerText.textContent = 'Waiting for connection...';
      }
    }

    // Check connection status on load
    updateConnectionStatus();

    // Listen for connection changes
    window.addEventListener('online', updateConnectionStatus);
    window.addEventListener('offline', updateConnectionStatus);
  </script>
</body>
</html>
